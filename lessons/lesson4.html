<!doctype html>
<html>
  <head>
    Lesson4
  </head>
  <style>
    .counter-button {
      background-color: rgb(25, 135, 84);
      color: white;
      padding: 12px 20px;
      margin-left: 10px;
      border: none;
      border-radius: 5px;
    }

    .reset-button {
      background-color: rgb(25, 135, 84);
      color: white;
      padding: 12px 20px;
      margin-left: 10px;
      border: none;
      border-radius: 5px;
    }

    .auto-click-button {
      background-color: rgb(25, 135, 84);
      color: white;
      padding: 12px 20px;
      margin-left: 10px;
      border: none;
      border-radius: 5px;
    }
  </style>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script type="text/babel">
      function CounterApp() {
        const [count, setCount] = React.useState(0);
        const buttonRef = React.useRef(null);
        const intervalRef = React.useRef(null);
        function toggleAutoClick() {
          if (intervalRef.current !== null) {
            clearInterval(intervalRef.current);
            intervalRef.current = null;
          } else {
            intervalRef.current = setInterval(() => {
              buttonRef.current.click();
            }, 1000);
          }
        }
        return (
          <div>
            <button
              className="counter-button"
              ref={buttonRef}
              onClick={() => setCount(count + 1)}
            >
              Clicked {count} times
            </button>

            <button className="reset-button" onClick={() => setCount(0)}>
              Reset
            </button>

            <button
              className="auto-click-button"
              onClick={() => {
                toggleAutoClick();
              }}
            >
              Auto Click
            </button>
          </div>
        );
      }

      function Clock() {
        const [time, setTime] = React.useState(dayjs().format("HH:mm:ss"));

        React.useEffect(() => {
          const timerId = setInterval(() => {
            setTime(dayjs().format("HH:mm:ss"));
          }, 1000);
          return () => clearInterval(timerId);
        });
        return <p>{time}</p>;
      }

      function LoginForm() {
        const [showPassword, setShowPassword] = React.useState(false);
        return (
          <div>
            <p>Hello, welcome to my website</p>
            <div
              style={{
                display: "flex",
                flexDirection: "column",
                gap: "8px",
              }}
            >
              <input placeholder="Email" />
              <input
                type={showPassword ? "text" : "password"}
                placeholder="Password"
              />
            </div>
            <div
              style={{
                flexDirection: "row",
                display: "flex",
                gap: "20px",
              }}
            >
              <button style={{ backgroundColor: "blue", color: "white" }}>
                Login
              </button>
              <button style={{ backgroundColor: "blue", color: "white" }}>
                Sign up
              </button>
            </div>
            <button onClick={() => setShowPassword(!showPassword)}>
              {showPassword ? "Hide" : "Show"}
            </button>
          </div>
        );
      }

      function App() {
        const [isButtonOn, setIsButtonOn] = React.useState(true);
        return (
          <>
            <div>
              <LoginForm />

              <button
                onClick={() => setIsButtonOn(!isButtonOn)}
                style={
                  isButtonOn
                    ? {
                        backgroundColor: "rgb(25, 135, 84)",
                        borderRadius: "5px",
                        color: "white",
                      }
                    : {
                        backgroundColor: "red",
                        borderRadius: "5px",
                        color: "white",
                      }
                }
              >
                {isButtonOn ? <p>ON</p> : <p>OFF</p>}
              </button>
              <p>My name is Ankit</p>
              <Clock />
              <CounterApp />
            </div>
          </>
        );
      }
      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
